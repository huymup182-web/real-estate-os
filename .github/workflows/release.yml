# Build và đẩy image lên GitHub Container Registry sau mỗi lần merge vào main (TASK-160, docs/deployment.md).
# Tag image = commit git (và latest). Triển khai lên máy chủ bằng workflow Deploy, chạy tay.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Đẩy image
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image:
          - { name: backend, dockerfile: backend/Dockerfile }
          - { name: admin, dockerfile: admin/Dockerfile }
          - { name: migrate, dockerfile: database/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/real-estate-os-${{ matrix.image.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/real-estate-os-${{ matrix.image.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
