# Prometheus cho production (TASK-160, docs/monitoring.md). Chạy với profile monitoring của docker-compose.yml.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: backend
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      # Cùng giá trị METRICS_TOKEN trong production.env
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['backend:3000']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
