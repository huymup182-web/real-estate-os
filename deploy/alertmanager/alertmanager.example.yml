# Nơi nhận cảnh báo (TASK-160, docs/deployment.md). Mặc định Claude chọn: email qua SMTP đang dùng cho ứng dụng.
# Copy thành deploy/alertmanager/alertmanager.yml trên máy chủ, điền giá trị. KHÔNG commit file đó (có mật khẩu).
global:
  smtp_smarthost: 'smtp.example.vn:587'
  smtp_from: 'canh-bao@example.vn'
  smtp_auth_username: ''
  smtp_auth_password: ''
  smtp_require_tls: true

route:
  receiver: email
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Khẩn cấp: nhắc lại mỗi 30 phút đến khi xử lý xong
    - matchers: ['severity="critical"']
      receiver: email
      repeat_interval: 30m

receivers:
  - name: email
    email_configs:
      - to: 'van-hanh@example.vn'
        send_resolved: true
