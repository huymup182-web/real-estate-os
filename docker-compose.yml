# Môi trường phát triển local của AI Real Estate OS.
# Chạy: docker compose up
# Giá trị lấy từ file .env (copy từ .env.example); nếu không có .env thì dùng mặc định bên dưới.

name: real-estate-os

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-real_estate_os}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    restart: unless-stopped
    environment:
      SERVICE_NAME: backend
      PORT: 3000
      DEV_SCRIPT: start:dev
      # Trong network nội bộ, backend gọi database qua tên service "postgres"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-real_estate_os}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile.dev
    restart: unless-stopped
    environment:
      SERVICE_NAME: admin
      PORT: 3001
      DEV_SCRIPT: dev
      # URL backend trong network nội bộ (dùng cho gọi API phía server)
      API_INTERNAL_URL: http://backend:3000
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  backend_node_modules:
  admin_node_modules:
